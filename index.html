<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>少年野球 配車ヘルパー</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<h1>⚾ 少年野球 配車ヘルパー</h1>

<!-- リアルタイム状況バー -->
<div class="status-bar" id="statusBar">
  <div class="status-item">
    <span class="status-label">参加選手</span>
    <span class="status-val" id="countKids">0人</span>
  </div>
  <div class="status-item">
    <span class="status-label">現地</span>
    <span class="status-val" id="countOnSite">0人</span>
  </div>
  <div class="status-sep">/</div>
  <div class="status-item">
    <span class="status-label">乗車定員</span>
    <span class="status-val" id="countSeats">0席</span>
  </div>
  <div class="status-sep">▶</div>
  <div class="status-item">
    <span class="status-label" id="statusDiffLabel">状況</span>
    <span class="status-val" id="statusDiff">0席</span>
  </div>
</div>

<!-- クイック操作バー -->
<div class="control-bar">
  <button type="button" class="control-btn" data-action="clear-checks">🔄 出欠チェックを全解除</button>
  <button type="button" class="control-btn" data-action="manual-save">💾 今の状態を保存</button>
</div>

<!-- 1. 車両設定 -->
<div class="card">
  <div class="card-header">
    <h2>1. 本日の車（同乗クイック追加）</h2>
    <div class="header-actions">
      <button type="button" class="btn-mini" data-action="sort-cars">🔤 名前順</button>
    </div>
  </div>
  <div id="carList"></div>
  <div class="add-form">
    <input type="text" id="newCarName" placeholder="車の名前/親の名前">
    <input type="number" id="newCarCapacity" placeholder="定員" value="3">
    <button type="button" class="btn-secondary" data-action="add-car">追加</button>
  </div>
</div>

<!-- 2. 子供・出欠設定 -->
<div class="card">
  <div class="card-header">
    <h2>2. 参加する子供（出欠・親の車・指定車両）</h2>
    <div class="header-actions">
      <button type="button" class="btn-mini" data-action="sort-grade">🎒 学年順</button>
      <button type="button" class="btn-mini" data-action="sort-name">🔤 五十音順</button>
      <button type="button" class="btn-mini" data-action="promote">🎓 進級</button>
    </div>
  </div>
  <div id="childList"></div>
  <div class="add-form">
    <input type="text" id="newChildName" placeholder="名前">
    <select id="newChildGrade">
      <option value="6">6年</option>
      <option value="5">5年</option>
      <option value="4">4年</option>
      <option value="3">3年</option>
      <option value="2">2年</option>
      <option value="1">1年</option>
    </select>
    <select id="newChildPos">
      <option value="投手">投手</option>
      <option value="捕手">捕手</option>
      <option value="内野">内野</option>
      <option value="外野">外野</option>
      <option value="未定">未定</option>
    </select>
    <select id="newChildParentCar">
      <option value="">親の車: なし</option>
    </select>
    <label class="inline-check-label">
      <input type="checkbox" id="newChildMotionSick"> 🤢車酔
    </label>
    <button type="button" class="btn-secondary" data-action="add-child">追加</button>
  </div>
</div>

<!-- 3. 配車設定・実行 -->
<div class="card">
  <h2>3. 配車ルール・条件</h2>
  <div class="mode-select-box">
    <label class="mode-label">割り振りの優先モード:</label>
    <select id="carpoolMode">
      <option value="balance">⚖ 標準（親の車固定 ＋ 過去履歴重視）</option>
      <option value="grade_same">🎒 学年を固める（同学年同士を同乗）</option>
      <option value="grade_diff">🔀 学年をバラバラに（高学年と低学年を分散）</option>
      <option value="position">⚾ ポジション分散（投手・捕手などの偏り防止）</option>
    </select>
  </div>
  <button type="button" class="btn btn-primary" data-action="generate">⚡ 配車を組む / 組み直す</button>
</div>

<!-- 4. 結果表示 -->
<div class="card result-card" id="resultCard">
  <h2>配車結果</h2>
  <div class="result-box" id="resultText"></div>
  <button type="button" class="btn btn-outline" data-action="generate">🔄 別の組み合わせで再計算する</button>
  <button type="button" class="btn btn-success" data-action="copy-result">📋 LINE用テキストをコピー（履歴を確定保存）</button>
</div>

<div class="card backup-card">
  <h2>📦 データのバックアップ・復元</h2>
  <button type="button" class="btn btn-outline" data-action="copy-backup">📋 バックアップ用データをコピー</button>
  <button type="button" class="btn btn-restore" data-action="open-restore">📥 データを復元する</button>
</div>

<div class="reset-link">
  <button type="button" data-action="reset-data">データを完全に初期化（初期サンプルに戻す）</button>
</div>

<!-- バックアップ復元モーダル -->
<div class="modal-overlay" id="restoreModal">
  <div class="modal-box">
    <h3>データの復元</h3>
    <div class="modal-field">
      <label for="restoreJson">バックアップ用データを貼り付け</label>
      <textarea id="restoreJson" class="restore-input" placeholder="コピーしたJSONをここに貼り付け"></textarea>
    </div>
    <div class="modal-actions">
      <button type="button" class="btn btn-secondary" data-action="close-restore">キャンセル</button>
      <button type="button" class="btn btn-primary" data-action="apply-restore">復元</button>
    </div>
  </div>
</div>

<!-- 選手情報 編集モーダル -->
<div class="modal-overlay" id="editModal">
  <div class="modal-box">
    <h3>選手情報の編集</h3>
    <input type="hidden" id="editChildId">
    <div class="modal-field">
      <label>選手名</label>
      <input type="text" id="editChildName">
    </div>
    <div class="modal-field">
      <label>学年</label>
      <select id="editChildGrade">
        <option value="6">6年</option>
        <option value="5">5年</option>
        <option value="4">4年</option>
        <option value="3">3年</option>
        <option value="2">2年</option>
        <option value="1">1年</option>
      </select>
    </div>
    <div class="modal-field">
      <label>ポジション</label>
      <select id="editChildPos">
        <option value="投手">投手</option>
        <option value="捕手">捕手</option>
        <option value="内野">内野</option>
        <option value="外野">外野</option>
        <option value="未定">未定</option>
      </select>
    </div>
    <div class="modal-field">
      <label>親の車</label>
      <select id="editChildParentCar">
        <option value="">なし</option>
      </select>
    </div>
    <div class="modal-field">
      <label>指定車両（固定）</label>
      <select id="editChildFixedCar">
        <option value="">自動（指定なし）</option>
      </select>
    </div>
    <div class="modal-field modal-field-motion">
      <label class="motion-edit-label">
        <input type="checkbox" id="editChildMotionSick">
        🤢 車酔いしやすい（助手席・前方優先）
      </label>
    </div>
    <div class="modal-actions">
      <button type="button" class="btn btn-secondary" data-action="close-modal">キャンセル</button>
      <button type="button" class="btn btn-primary" data-action="save-child">保存</button>
    </div>
  </div>
</div>

<!-- 依存順: data → ui → carpool → app（この順を崩さない） -->
<script src="js/data.js?v=20261025j"></script>
<script src="js/ui.js?v=20261025j"></script>
<script src="js/carpool.js?v=20261025j"></script>
<script src="js/app.js?v=20261025j"></script>
</body>
</html>
