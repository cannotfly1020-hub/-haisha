<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>少年野球 配車ヘルパー</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f4f6f9; margin: 0; padding: 12px; color: #333; }
  h1 { font-size: 19px; text-align: center; margin: 10px 0 15px; color: #1e3a8a; }
  .card { background: white; border-radius: 12px; padding: 14px; margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  .card h2 { font-size: 15px; margin-top: 0; border-bottom: 2px solid #e2e8f0; padding-bottom: 6px; color: #334155; display: flex; justify-content: space-between; align-items: center; }
  
  .btn { display: block; width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; text-align: center; }
  .btn-primary { background-color: #2563eb; color: white; margin-top: 10px; }
  .btn-success { background-color: #16a34a; color: white; margin-top: 10px; }
  .btn-secondary { background-color: #475569; color: white; padding: 8px 12px; font-size: 13px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; }
  .btn-edit { background: #e0f2fe; color: #0284c7; border: none; border-radius: 6px; padding: 4px 7px; font-size: 12px; cursor: pointer; margin-left: 4px; }
  .btn-delete { background: #fee2e2; color: #dc2626; border: none; border-radius: 6px; padding: 4px 7px; font-size: 12px; cursor: pointer; margin-left: 4px; }
  .btn-mini { background: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; border-radius: 6px; padding: 3px 8px; font-size: 11px; cursor: pointer; font-weight: normal; }
  
  .item-row { display: flex; align-items: center; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid #f1f5f9; gap: 4px; }
  .item-left { display: flex; align-items: center; flex: 1; min-width: 0; }
  .item-left label { display: flex; align-items: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; cursor: pointer; }
  .item-left input[type="checkbox"] { width: 18px; height: 18px; margin-right: 8px; flex-shrink: 0; }
  .item-right { display: flex; align-items: center; flex-shrink: 0; font-size: 13px; color: #475569; }
  
  .add-form { display: flex; gap: 6px; margin-top: 10px; width: 100%; flex-wrap: wrap; }
  input[type="text"], input[type="number"], select { padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; }
  
  .badge { font-size: 11px; padding: 2px 5px; border-radius: 4px; background: #e0e7ff; color: #3730a3; margin-left: 4px; white-space: nowrap; }
  .badge-sub { font-size: 11px; padding: 2px 5px; border-radius: 4px; background: #f1f5f9; color: #475569; margin-left: 4px; white-space: nowrap; }
  .badge-motion { font-size: 11px; padding: 2px 5px; border-radius: 4px; background: #fef2f2; color: #b91c1c; margin-left: 4px; white-space: nowrap; }
  
  .mode-select-box { margin-top: 10px; padding: 10px; background: #eef2ff; border-radius: 8px; }
  .mode-select-box select { width: 100%; background: white; font-weight: bold; color: #1e3a8a; }
  
  .result-box { background: #f8fafc; border: 1px dashed #94a3b8; border-radius: 8px; padding: 12px; font-family: monospace; font-size: 13px; white-space: pre-wrap; margin-top: 10px; line-height: 1.5; }
  .reset-link { text-align: center; margin-top: 25px; margin-bottom: 15px; }
  .reset-link button { background: none; border: none; color: #94a3b8; font-size: 12px; text-decoration: underline; cursor: pointer; }

  /* 編集モーダル */
  .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 100; justify-content: center; align-items: center; padding: 20px; }
  .modal-box { background: white; width: 100%; max-width: 320px; border-radius: 12px; padding: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
  .modal-box h3 { margin-top: 0; font-size: 16px; color: #1e3a8a; margin-bottom: 12px; }
  .modal-field { margin-bottom: 10px; }
  .modal-field label { display: block; font-size: 12px; color: #64748b; margin-bottom: 4px; }
  .modal-field input, .modal-field select { width: 100%; }
  .modal-actions { display: flex; gap: 8px; margin-top: 15px; }
</style>
</head>
<body>

<h1>⚾ 少年野球 配車ヘルパー</h1>

<!-- 1. 車両設定 -->
<div class="card">
  <h2>1. 本日の車（出せる車にチェック）</h2>
  <div id="carList"></div>
  <div class="add-form">
    <input type="text" id="newCarName" placeholder="車の名前/親の名前" style="flex: 3; min-width: 120px;">
    <input type="number" id="newCarCapacity" placeholder="定員" value="3" style="width: 55px;">
    <button class="btn-secondary" onclick="addCar()">追加</button>
  </div>
</div>

<!-- 2. 子供・出欠設定 -->
<div class="card">
  <h2>
    <span>2. 参加する子供</span>
    <button class="btn-mini" onclick="promoteAllGrades()">🎓 全員進級(+1学年)</button>
  </h2>
  <div id="childList"></div>
  <div class="add-form">
    <input type="text" id="newChildName" placeholder="名前" style="flex: 2; min-width: 65px;">
    <select id="newChildGrade" style="width: 60px;">
      <option value="6">6年</option>
      <option value="5">5年</option>
      <option value="4">4年</option>
      <option value="3">3年</option>
      <option value="2">2年</option>
      <option value="1">1年</option>
    </select>
    <select id="newChildPos" style="width: 68px;">
      <option value="投手">投手</option>
      <option value="捕手">捕手</option>
      <option value="内野">内野</option>
      <option value="外野">外野</option>
      <option value="未定">未定</option>
    </select>
    <input type="text" id="newChildParentCar" placeholder="親の車(任意)" style="flex: 2; min-width: 80px;">
    <label style="display: flex; align-items: center; font-size: 12px; gap: 4px; padding: 4px;">
      <input type="checkbox" id="newChildMotionSick"> 🤢車酔い
    </label>
    <button class="btn-secondary" onclick="addChild()">追加</button>
  </div>
</div>

<!-- 3. 配車設定・実行 -->
<div class="card">
  <h2>3. 配車ルール・条件</h2>
  <div class="mode-select-box">
    <label style="font-size: 12px; font-weight: bold; color: #475569; display: block; margin-bottom: 4px;">割り振りの優先モード:</label>
    <select id="carpoolMode">
      <option value="balance">⚖ 標準（過去の履歴と乗車バランス重視）</option>
      <option value="grade_same">🎒 学年を固める（同学年同士を同乗）</option>
      <option value="grade_diff">🔀 学年をバラバラに（高学年と低学年を分散）</option>
      <option value="position">⚾ ポジション分散（投手・捕手などの偏り防止）</option>
    </select>
  </div>
  <button class="btn btn-primary" onclick="generateCarpool()">⚡ 条件に合わせて配車を組む</button>
</div>

<!-- 4. 結果表示 -->
<div class="card" id="resultCard" style="display:none; margin-top: 15px;">
  <h2>配車結果</h2>
  <div class="result-box" id="resultText"></div>
  <button class="btn btn-success" onclick="copyResult()">📋 LINE用テキストをコピー</button>
</div>

<div class="reset-link">
  <button onclick="resetAllData()">データを初期状態にリセット</button>
</div>

<!-- 選手情報 編集モーダル -->
<div class="modal-overlay" id="editModal">
  <div class="modal-box">
    <h3>選手情報の編集</h3>
    <input type="hidden" id="editChildId">
    <div class="modal-field">
      <label>選手名</label>
      <input type="text" id="editChildName">
    </div>
    <div class="modal-field">
      <label>学年</label>
      <select id="editChildGrade">
        <option value="6">6年</option>
        <option value="5">5年</option>
        <option value="4">4年</option>
        <option value="3">3年</option>
        <option value="2">2年</option>
        <option value="1">1年</option>
      </select>
    </div>
    <div class="modal-field">
      <label>ポジション</label>
      <select id="editChildPos">
        <option value="投手">投手</option>
        <option value="捕手">捕手</option>
        <option value="内野">内野</option>
        <option value="外野">外野</option>
        <option value="未定">未定</option>
      </select>
    </div>
    <div class="modal-field">
      <label>親の車（空欄可）</label>
      <input type="text" id="editChildParentCar" placeholder="例: 佐藤号">
    </div>
    <div class="modal-field" style="margin-top: 12px;">
      <label style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #b91c1c; cursor: pointer;">
        <input type="checkbox" id="editChildMotionSick" style="width: 18px; height: 18px;">
        🤢 車酔いしやすい（助手席・前方優先）
      </label>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeEditModal()" style="flex:1;">キャンセル</button>
      <button class="btn btn-primary" onclick="saveEditChild()" style="flex:1; margin-top:0;">保存</button>
    </div>
  </div>
</div>

<script>
let cars = JSON.parse(localStorage.getItem('cp_cars')) || [
  { id: 1, name: '佐藤号', capacity: 3, active: true },
  { id: 2, name: '鈴木号', capacity: 3, active: true },
  { id: 3, name: '田中号(荷物車)', capacity: 2, active: true }
];

let children = JSON.parse(localStorage.getItem('cp_children')) || [
  { id: 1, name: 'ゆうと', grade: 6, pos: '投手', parentCar: '佐藤号', motionSick: false, active: true, lastCar: '', rideHistory: {} },
  { id: 2, name: 'そうた', grade: 6, pos: '捕手', parentCar: '鈴木号', motionSick: false, active: true, lastCar: '', rideHistory: {} },
  { id: 3, name: 'れん', grade: 5, pos: '内野', parentCar: '', motionSick: true, active: true, lastCar: '', rideHistory: {} },
  { id: 4, name: 'はると', grade: 5, pos: '外野', parentCar: '', motionSick: false, active: true, lastCar: '', rideHistory: {} },
  { id: 5, name: 'こうき', grade: 4, pos: '内野', parentCar: '', motionSick: false, active: true, lastCar: '', rideHistory: {} },
  { id: 6, name: '大和', grade: 3, pos: '外野', parentCar: '', motionSick: false, active: true, lastCar: '', rideHistory: {} }
];

function saveData() {
  localStorage.setItem('cp_cars', JSON.stringify(cars));
  localStorage.setItem('cp_children', JSON.stringify(children));
}

function renderCars() {
  const list = document.getElementById('carList');
  list.innerHTML = '';
  cars.forEach(car => {
    list.innerHTML += `
      <div class="item-row">
        <div class="item-left">
          <label>
            <input type="checkbox" ${car.active ? 'checked' : ''} onchange="toggleCar(${car.id})">
            <span><strong>${car.name}</strong></span>
          </label>
        </div>
        <div class="item-right">
          定員:<input type="number" value="${car.capacity}" style="width: 40px; margin: 0 4px; padding: 4px;" onchange="updateCapacity(${car.id}, this.value)">人
          <button class="btn-delete" onclick="deleteCar(${car.id})">✕</button>
        </div>
      </div>
    `;
  });
}

function renderChildren() {
  const list = document.getElementById('childList');
  list.innerHTML = '';
  children.forEach(c => {
    list.innerHTML += `
      <div class="item-row">
        <div class="item-left">
          <label>
            <input type="checkbox" ${c.active ? 'checked' : ''} onchange="toggleChild(${c.id})">
            <span>${c.name}</span>
            <span class="badge-sub">${c.grade ? c.grade + '年' : ''}</span>
            <span class="badge-sub">${c.pos || ''}</span>
            ${c.motionSick ? `<span class="badge-motion">🤢酔い</span>` : ''}
            ${c.parentCar ? `<span class="badge">親:${c.parentCar}</span>` : ''}
          </label>
        </div>
        <div class="item-right">
          <button class="btn-edit" onclick="openEditModal(${c.id})">✏️</button>
          <button class="btn-delete" onclick="deleteChild(${c.id})">✕</button>
        </div>
      </div>
    `;
  });
}

function toggleCar(id) {
  const c = cars.find(x => x.id === id);
  if(c) c.active = !c.active;
  saveData();
}

function updateCapacity(id, val) {
  const c = cars.find(x => x.id === id);
  if(c) c.capacity = parseInt(val) || 0;
  saveData();
}

function toggleChild(id) {
  const ch = children.find(x => x.id === id);
  if(ch) ch.active = !ch.active;
  saveData();
}

function deleteCar(id) {
  const car = cars.find(x => x.id === id);
  if(confirm(`「${car.name}」を削除しますか？`)) {
    cars = cars.filter(x => x.id !== id);
    saveData();
    renderCars();
  }
}

function deleteChild(id) {
  const kid = children.find(x => x.id === id);
  if(confirm(`「${kid.name}」を削除しますか？`)) {
    children = children.filter(x => x.id !== id);
    saveData();
    renderChildren();
  }
}

/* 編集機能 */
function openEditModal(id) {
  const kid = children.find(x => x.id === id);
  if(!kid) return;
  document.getElementById('editChildId').value = kid.id;
  document.getElementById('editChildName').value = kid.name;
  document.getElementById('editChildGrade').value = kid.grade || 6;
  document.getElementById('editChildPos').value = kid.pos || '未定';
  document.getElementById('editChildParentCar').value = kid.parentCar || '';
  document.getElementById('editChildMotionSick').checked = !!kid.motionSick;
  document.getElementById('editModal').style.display = 'flex';
}

function closeEditModal() {
  document.getElementById('editModal').style.display = 'none';
}

function saveEditChild() {
  const id = parseInt(document.getElementById('editChildId').value);
  const kid = children.find(x => x.id === id);
  if(kid) {
    kid.name = document.getElementById('editChildName').value.trim() || kid.name;
    kid.grade = parseInt(document.getElementById('editChildGrade').value);
    kid.pos = document.getElementById('editChildPos').value;
    kid.parentCar = document.getElementById('editChildParentCar').value.trim();
    kid.motionSick = document.getElementById('editChildMotionSick').checked;
    saveData();
    renderChildren();
  }
  closeEditModal();
}

/* 一括進級機能 */
function promoteAllGrades() {
  if(confirm("全選手の学年を1つ繰り上げますか？\n（現在6年生の選手はチェックが外れて卒団扱いになります）")) {
    children.forEach(c => {
      if(c.grade < 6) {
        c.grade += 1;
      } else {
        c.active = false;
      }
    });
    saveData();
    renderChildren();
  }
}

function addCar() {
  const name = document.getElementById('newCarName').value.trim();
  const cap = parseInt(document.getElementById('newCarCapacity').value) || 3;
  if(name) {
    cars.push({ id: Date.now(), name: name, capacity: cap, active: true });
    saveData();
    renderCars();
    document.getElementById('newCarName').value = '';
  }
}

function addChild() {
  const name = document.getElementById('newChildName').value.trim();
  const grade = parseInt(document.getElementById('newChildGrade').value) || 6;
  const pos = document.getElementById('newChildPos').value;
  const parent = document.getElementById('newChildParentCar').value.trim();
  const motionSick = document.getElementById('newChildMotionSick').checked;
  if(name) {
    children.push({ id: Date.now(), name: name, grade: grade, pos: pos, parentCar: parent, motionSick: motionSick, active: true, lastCar: '', rideHistory: {} });
    saveData();
    renderChildren();
    document.getElementById('newChildName').value = '';
    document.getElementById('newChildParentCar').value = '';
    document.getElementById('newChildMotionSick').checked = false;
  }
}

function resetAllData() {
  if(confirm("登録した車・子供・履歴データをすべて初期化しますか？")) {
    localStorage.clear();
    location.reload();
  }
}

let lastGeneratedPlan = "";

function generateCarpool() {
  const activeCars = cars.filter(c => c.active);
  const activeKids = children.filter(c => c.active);
  const mode = document.getElementById('carpoolMode').value;

  const totalCap = activeCars.reduce((sum, c) => sum + c.capacity, 0);
  if (totalCap < activeKids.length) {
    alert(`座席が足りません！\n子供の人数: ${activeKids.length}人\n現在の空き席: ${totalCap}席`);
    return;
  }

  let assignments = {};
  let carCaps = {};
  activeCars.forEach(c => {
    assignments[c.name] = [];
    carCaps[c.name] = c.capacity;
  });

  let unassigned = [...activeKids];

  // 1. 親の車がある子を最優先
  for (let i = unassigned.length - 1; i >= 0; i--) {
    let kid = unassigned[i];
    if (kid.parentCar && assignments[kid.parentCar] && carCaps[kid.parentCar] > 0) {
      assignments[kid.parentCar].push(kid);
      carCaps[kid.parentCar]--;
      unassigned.splice(i, 1);
    }
  }

  // 2. 親の車がない「車酔いの子」を優先配備
  for (let i = unassigned.length - 1; i >= 0; i--) {
    let kid = unassigned[i];
    if (kid.motionSick) {
      let availableCars = activeCars.filter(c => carCaps[c.name] > 0);
      availableCars.sort((a, b) => {
        let diffA = (kid.lastCar === a.name) ? 99 : 0;
        let diffB = (kid.lastCar === b.name) ? 99 : 0;
        if(diffA !== diffB) return diffA - diffB;
        return carCaps[b.name] - carCaps[a.name];
      });
      let targetCar = availableCars[0];
      assignments[targetCar.name].push(kid);
      carCaps[targetCar.name]--;
      unassigned.splice(i, 1);
    }
  }

  // 3. モード別ソート
  if (mode === 'grade_same') {
    unassigned.sort((a, b) => (b.grade || 0) - (a.grade || 0));
  } else if (mode === 'grade_diff') {
    unassigned.sort((a, b) => (b.grade || 0) - (a.grade || 0));
    let interleaved = [];
    let left = 0, right = unassigned.length - 1;
    while(left <= right) {
      if(left === right) { interleaved.push(unassigned[left]); break; }
      interleaved.push(unassigned[left++]);
      interleaved.push(unassigned[right--]);
    }
    unassigned = interleaved;
  } else if (mode === 'position') {
    unassigned.sort((a, b) => (a.pos || '').localeCompare(b.pos || ''));
  } else {
    unassigned.sort(() => Math.random() - 0.5);
  }

  // 4. 車両割り当て
  unassigned.forEach(kid => {
    if (!kid.rideHistory) kid.rideHistory = {};

    let availableCars = activeCars.filter(c => carCaps[c.name] > 0);

    availableCars.sort((a, b) => {
      let scoreA = 0;
      let scoreB = 0;

      if (kid.lastCar === a.name) scoreA += 500;
      if (kid.lastCar === b.name) scoreB += 500;

      scoreA += (kid.rideHistory[a.name] || 0) * 10;
      scoreB += (kid.rideHistory[b.name] || 0) * 10;

      if (mode === 'grade_same') {
        let countSameGradeA = assignments[a.name].filter(k => k.grade === kid.grade).length;
        let countSameGradeB = assignments[b.name].filter(k => k.grade === kid.grade).length;
        scoreA -= countSameGradeA * 50;
        scoreB -= countSameGradeB * 50;
      } else if (mode === 'grade_diff') {
        let countSameGradeA = assignments[a.name].filter(k => k.grade === kid.grade).length;
        let countSameGradeB = assignments[b.name].filter(k => k.grade === kid.grade).length;
        scoreA += countSameGradeA * 40;
        scoreB += countSameGradeB * 40;
      } else if (mode === 'position') {
        let countSamePosA = assignments[a.name].filter(k => k.pos === kid.pos && k.pos !== '未定').length;
        let countSamePosB = assignments[b.name].filter(k => k.pos === kid.pos && k.pos !== '未定').length;
        scoreA += countSamePosA * 40;
        scoreB += countSamePosB * 40;
      }

      if (scoreA !== scoreB) return scoreA - scoreB;
      return carCaps[b.name] - carCaps[a.name];
    });

    let targetCar = availableCars[0];
    assignments[targetCar.name].push(kid);
    carCaps[targetCar.name]--;
  });

  // 結果テキストの生成（※名前のみ表示にシンプル化）
  let hasMotionSick = activeKids.some(k => k.motionSick);
  let text = `【連絡】本日の配車です🚗\n---------------------\n`;
  for (let carName in assignments) {
    let names = assignments[carName].map(k => {
      let tag = k.motionSick ? '🤢' : '';
      return `${k.name}${tag}`;
    }).join('、');
    text += `■ ${carName} (${assignments[carName].length}名)\n  乗車: ${names || 'なし'}\n\n`;
    
    assignments[carName].forEach(k => {
      let orig = children.find(x => x.id === k.id);
      if (orig) {
        if (!orig.rideHistory) orig.rideHistory = {};
        orig.rideHistory[carName] = (orig.rideHistory[carName] || 0) + 1;
        orig.lastCar = carName;
      }
    });
  }
  if (hasMotionSick) {
    text += "※「🤢」マークの選手は助手席または前寄りの座席をお願いします。\n";
  }
  text += "---------------------\nよろしくお願いいたします！";

  saveData();
  renderChildren();

  lastGeneratedPlan = text;
  document.getElementById('resultText').innerText = text;
  document.getElementById('resultCard').style.display = 'block';
  window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
}

function copyResult() {
  navigator.clipboard.writeText(lastGeneratedPlan).then(() => {
    alert("LINE用テキストをコピーしました！\nLINEグループにそのまま貼り付けてください。");
  });
}

renderCars();
renderChildren();
</script>
</body>
</html>
