<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>少年野球 配車ヘルパー</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f4f6f9; margin: 0; padding: 15px; color: #333; }
  h1 { font-size: 20px; text-align: center; margin-bottom: 15px; color: #1e3a8a; }
  .card { background: white; border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.06); }
  .card h2 { font-size: 16px; margin-top: 0; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px; color: #334155; }
  .btn { display: block; width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; text-align: center; }
  .btn-primary { background-color: #2563eb; color: white; margin-top: 10px; }
  .btn-success { background-color: #16a34a; color: white; margin-top: 10px; }
  .btn-secondary { background-color: #64748b; color: white; padding: 6px 12px; font-size: 12px; border-radius: 6px; width: auto; display: inline-block; }
  .car-item, .child-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #f1f5f9; }
  input[type="text"], input[type="number"], select { padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; }
  .result-box { background: #f8fafc; border: 1px dashed #94a3b8; border-radius: 8px; padding: 12px; font-family: monospace; font-size: 14px; white-space: pre-wrap; margin-top: 10px; }
  .badge { font-size: 11px; padding: 2px 6px; border-radius: 4px; background: #e0e7ff; color: #3730a3; margin-left: 5px; }
</style>
</head>
<body>

<h1>⚾ 少年野球 配車ヘルパー</h1>

<!-- 1. 車両設定 -->
<div class="card">
  <h2>1. 本日の車（出せる車にチェック）</h2>
  <div id="carList"></div>
  <div style="margin-top: 10px; display: flex; gap: 5px;">
    <input type="text" id="newCarName" placeholder="車の名前/親の名前" style="flex: 2;">
    <input type="number" id="newCarCapacity" placeholder="空き席" value="3" style="flex: 1;">
    <button class="btn btn-secondary" onclick="addCar()">追加</button>
  </div>
</div>

<!-- 2. 子供・出欠設定 -->
<div class="card">
  <h2>2. 参加する子供（乗車する子にチェック）</h2>
  <div id="childList"></div>
  <div style="margin-top: 10px; display: flex; gap: 5px;">
    <input type="text" id="newChildName" placeholder="子供の名前" style="flex: 2;">
    <input type="text" id="newChildParentCar" placeholder="親の車名(任意)" style="flex: 2;">
    <button class="btn btn-secondary" onclick="addChild()">追加</button>
  </div>
</div>

<!-- 3. 配車実行 -->
<button class="btn btn-primary" onclick="generateCarpool()">⚡ 前回の重複を避けて配車を組む</button>

<!-- 4. 結果表示 -->
<div class="card" id="resultCard" style="display:none; margin-top: 15px;">
  <h2>配車結果</h2>
  <div class="result-box" id="resultText"></div>
  <button class="btn btn-success" onclick="copyResult()">📋 LINE用テキストをコピー</button>
</div>

<script>
// 初期データ（端末の保存領域から読み込み、無ければデフォルト）
let cars = JSON.parse(localStorage.getItem('cp_cars')) || [
  { id: 1, name: '佐藤号', capacity: 3, active: true },
  { id: 2, name: '鈴木号', capacity: 3, active: true },
  { id: 3, name: '田中号(荷物車)', capacity: 2, active: true }
];

let children = JSON.parse(localStorage.getItem('cp_children')) || [
  { id: 1, name: 'ゆうと', parentCar: '佐藤号', active: true, lastCar: '' },
  { id: 2, name: 'そうた', parentCar: '鈴木号', active: true, lastCar: '' },
  { id: 3, name: 'れん', parentCar: '', active: true, lastCar: '佐藤号' },
  { id: 4, name: 'はると', parentCar: '', active: true, lastCar: '鈴木号' },
  { id: 5, name: 'こうき', parentCar: '', active: true, lastCar: '' },
  { id: 6, name: '大和', parentCar: '', active: true, lastCar: '' }
];

function saveData() {
  localStorage.setItem('cp_cars', JSON.stringify(cars));
  localStorage.setItem('cp_children', JSON.stringify(children));
}

function renderCars() {
  const list = document.getElementById('carList');
  list.innerHTML = '';
  cars.forEach(car => {
    list.innerHTML += `
      <div class="car-item">
        <label>
          <input type="checkbox" ${car.active ? 'checked' : ''} onchange="toggleCar(${car.id})">
          <strong>${car.name}</strong>
        </label>
        <div>
          空き定員: <input type="number" value="${car.capacity}" style="width: 45px;" onchange="updateCapacity(${car.id}, this.value)"> 人
        </div>
      </div>
    `;
  });
}

function renderChildren() {
  const list = document.getElementById('childList');
  list.innerHTML = '';
  children.forEach(c => {
    list.innerHTML += `
      <div class="child-item">
        <label>
          <input type="checkbox" ${c.active ? 'checked' : ''} onchange="toggleChild(${c.id})">
          ${c.name}
          ${c.parentCar ? `<span class="badge">親:${c.parentCar}</span>` : ''}
        </label>
        <span style="font-size: 11px; color: #64748b;">
          前回: ${c.lastCar || 'なし'}
        </span>
      </div>
    `;
  });
}

function toggleCar(id) {
  const c = cars.find(x => x.id === id);
  if(c) c.active = !c.active;
  saveData();
}

function updateCapacity(id, val) {
  const c = cars.find(x => x.id === id);
  if(c) c.capacity = parseInt(val) || 0;
  saveData();
}

function toggleChild(id) {
  const ch = children.find(x => x.id === id);
  if(ch) ch.active = !ch.active;
  saveData();
}

function addCar() {
  const name = document.getElementById('newCarName').value.trim();
  const cap = parseInt(document.getElementById('newCarCapacity').value) || 3;
  if(name) {
    cars.push({ id: Date.now(), name: name, capacity: cap, active: true });
    saveData();
    renderCars();
    document.getElementById('newCarName').value = '';
  }
}

function addChild() {
  const name = document.getElementById('newChildName').value.trim();
  const parent = document.getElementById('newChildParentCar').value.trim();
  if(name) {
    children.push({ id: Date.now(), name: name, parentCar: parent, active: true, lastCar: '' });
    saveData();
    renderChildren();
    document.getElementById('newChildName').value = '';
    document.getElementById('newChildParentCar').value = '';
  }
}

let lastGeneratedPlan = "";

// 自動配車ロジック
function generateCarpool() {
  const activeCars = cars.filter(c => c.active);
  const activeKids = children.filter(c => c.active);

  // 席数チェック
  const totalCap = activeCars.reduce((sum, c) => sum + c.capacity, 0);
  if (totalCap < activeKids.length) {
    alert(`座席が足りません！\n子供の人数: ${activeKids.length}人\n現在の空き席: ${totalCap}席`);
    return;
  }

  // 車両枠の準備
  let assignments = {};
  let carCaps = {};
  activeCars.forEach(c => {
    assignments[c.name] = [];
    carCaps[c.name] = c.capacity;
  });

  let unassigned = [...activeKids];

  // 1. 親の車がある子を最優先で割り当て
  for (let i = unassigned.length - 1; i >= 0; i--) {
    let kid = unassigned[i];
    if (kid.parentCar && assignments[kid.parentCar] && carCaps[kid.parentCar] > 0) {
      assignments[kid.parentCar].push(kid);
      carCaps[kid.parentCar]--;
      unassigned.splice(i, 1);
    }
  }

  // 2. 残りの子を「前回と同じ車を避けて」割り当て
  // シャッフルして偏りを防ぐ
  unassigned.sort(() => Math.random() - 0.5);

  unassigned.forEach(kid => {
    // 候補の車（定員があり、かつ前回乗っていない車を優先）
    let availableCars = activeCars.filter(c => carCaps[c.name] > 0);
    
    // 前回と違う車を探す
    let preferredCars = availableCars.filter(c => c.name !== kid.lastCar);
    
    let targetCar = null;
    if (preferredCars.length > 0) {
      // 空きが多い車を優先
      preferredCars.sort((a, b) => carCaps[b.name] - carCaps[a.name]);
      targetCar = preferredCars[0];
    } else {
      // どうしても枠がない場合は仕方なく空いている車へ
      availableCars.sort((a, b) => carCaps[b.name] - carCaps[a.name]);
      targetCar = availableCars[0];
    }

    assignments[targetCar.name].push(kid);
    carCaps[targetCar.name]--;
  });

  // 結果テキストの生成 & 履歴の更新
  let text = "【連絡】本日の配車です🚗\n---------------------\n";
  for (let carName in assignments) {
    let names = assignments[carName].map(k => k.name).join('、');
    text += `■ ${carName} (${assignments[carName].length}名)\n  乗車: ${names || 'なし'}\n\n`;
    
    // 履歴更新
    assignments[carName].forEach(k => {
      let orig = children.find(x => x.id === k.id);
      if(orig) orig.lastCar = carName;
    });
  }
  text += "---------------------\nよろしくお願いいたします！";

  saveData();
  renderChildren(); // 前回乗車の表示を更新

  lastGeneratedPlan = text;
  document.getElementById('resultText').innerText = text;
  document.getElementById('resultCard').style.display = 'block';
  window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
}

function copyResult() {
  navigator.clipboard.writeText(lastGeneratedPlan).then(() => {
    alert("LINE用テキストをコピーしました！\nLINEグループにそのまま貼り付けてください。");
  });
}

// 初回描画
renderCars();
renderChildren();
</script>
</body>
</html>
